[project]
name = "cellseek-benchmark"
version = "0.1.0"
description = "Benchmark CellSeek and related models on microscopy datasets."
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "tqdm",
  "opencv-python-headless",
  "scipy",
  "tifffile",
  "pillow",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cellseek_benchmark*"]

[project.scripts]
csbench = "cellseek_benchmark.test:main"
