models:
  cellseek:
    type: cellseek
    enabled: true
    use_gpu: true
    checkpoint_path: /home/fzhaoai/cellseek/gui/weights/cpsam
    tracking_propagation: cutie

  cellpose:
    type: cellpose
    enabled: true
    pretrained_model: cpsam

  sam3:
    type: sam3
    enabled: true
    prompt: cell
    checkpoint_path: /home/fzhaoai/.cache/models--facebook--sam3/snapshots/2afe64078f4420bdfbc063162d1336003efadc81/sam3.pt
    tracking_max_long_edge: 1024
    tracking_offload_image_model: true

  microsam:
    type: microsam
    enabled: true
    checkpoint_path: /home/fzhaoai/cellseek/cellseek_benchmark/checkpoints/microsam_vit_b_lm.pt
    pred_iou_thresh: 0.35
    stability_score_thresh: 0.65
