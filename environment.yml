# Unified benchmark environment.
#
#   cd cellseek/benchmark
#   conda env create -f environment.yml
#   conda activate benchmark
#   pip install -e .
#
# Adjust pytorch-cuda / channel index to match your GPU driver.

name: benchmark

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - gcc_linux-64=13
  - gxx_linux-64=13
  - pytorch
  - torchvision
  - pytorch-cuda=12.4
  - pip:
      - -r requirements-benchmark.txt
